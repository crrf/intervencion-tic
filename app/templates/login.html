{% extends "base.html" %}
{% block titulo %}Iniciar sesion{% endblock %}

{% block contenido %}
<div class="pagina-login">
  <div class="caja-login">
    <div class="panel">
      <h1>Intervencion Tecnica</h1>
      <p class="subtitulo">Sistema de tickets e incidencias de conectividad</p>

      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" value="{{ usuario }}"
                 autocomplete="username" autofocus required>
        </div>
        <div class="campo">
          <label for="password">Contrasena</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <div class="campo">
          <label class="flex" style="font-weight:500;color:var(--texto)">
            <input type="checkbox" name="recordarme" value="1" style="width:auto">
            Mantener la sesion abierta
          </label>
        </div>
        <button class="btn btn-primario btn-bloque" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
